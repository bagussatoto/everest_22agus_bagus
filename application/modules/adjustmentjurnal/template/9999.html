<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{title}</title>

    <style>
        #someSvgElementId {
            width: 100%;
        }
    </style>

    <style type="text/css" media="print">
        .page
        {
            -webkit-transform: rotate(-90deg);
            -moz-transform:rotate(-90deg);
            filter:progid:DXImageTransform.Microsoft.BasicImage(rotation=3);
        }
    </style>

    <style>
        @media print{@page {size: landscape}}

        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            td{
                width: max-content;
            }
        }
        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            td{
                width: max-content;
            }
        }

        * {

            box-sizing: border-box;
            -moz-box-sizing: border-box;

        }

        .halaman-print {
            height: 215mm;
            min-width: 300mm;

            /*kecilkan padding untuk mmendapatkan margin yang tipis*/
            padding: 1mm;
            margin: 1mm auto;
            border: 0px #D3D3D3 solid;
            border-radius: 6px;
            background: grey;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.1);

        }

        .halaman {
            height: 210mm;
            min-width: 297mm;

            /*kecilkan padding untuk mmendapatkan margin yang tipis*/
            padding: 1mm;
            margin: 1mm auto;
            border: 0px #D3D3D3 solid;
            border-radius: 6px;
            background: white;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.1);

        }

        .margin-halaman {

            padding: 1mm;
            border: 0px grey solid;
            height: 297mm;
            /*outline: 1mm darkgrey solid;*/

        }

        @page {
            size: A4;
            margin: 0;
        }
        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }
            td{
                width: max-content;
            }
            span.text-white{
                display: none;
                visibility: hidden;
            }
        }

        @media print {

            html, body {
                height: 210mm;
                min-width: 297mm;
            }

            .halaman {
                margin: 0;
                border: initial;
                border-radius: initial;
                width: initial;
                min-height: initial;
                box-shadow: initial;
                background: initial;
                page-break-after: always;
            }

        }
    </style>

    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/jQuery/jquery-2.2.3.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>
    <script src="{cdn_suport}sweetalert2-master/dist/sweetalert2.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap3-dialog-master/dist/js/bootstrap-dialog.min.js?v={local_version}"></script>


    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/slimScroll/jquery.slimscroll.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/dist/js/app.min.js?v={local_version}"></script>
    <script src="{cdn_suport}multi-step-modal-master/multi-step-modal.js?v={local_version}"></script>

    <script src="{cdn_suport}bootstrap-fileinput-master/js/fileinput.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-toggle-master/js/bootstrap-toggle.min.js?v={local_version}"></script>
    <script src="{base}assets/custom/hippo_ajax.js?v={local_version}"></script>

    <link rel="stylesheet" href="{base}assets/custom/custom.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}bootstrap-3.3.7-dist/css/bootstrap.min.css?v={local_version}">

    <style>
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #FAFAFA;
            font-size: 12px;
            font-family: Consolas, Menlo, Monaco, Lucida Console, Liberation Mono, DejaVu Sans Mono, Bitstream Vera Sans Mono, Courier New, monospace, serif;
        }
    </style>
</head>

<body class="hold-transition skin-blue sidebar-mini" onload="" style="">

<div class="spacer">&nbsp;</div>

<div class="row">
    <div class="container">
    <div class="text-left col-md-6 col-xs-6 col-sm-6 no-padding">
        <img src="{base}assets/images/san_221iso.png" alt="a"  class="img-responsive">
    </div>
    <div class="text-left col-md-6 col-xs-6 col-sm-6 no-padding">
        {companyProfile}
    </div>
</div>
</div>

<div class="row">
    <div class="container">
    <div style="border-top: 4px double #000;" class="text-center col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h3>
            <heading3 class="text-bold text-uppercase">
                {title}
            </heading3>
        </h3>
    </div>
</div>
</div>

<div class="col-md-12" style="border: 0px solid blue;">
    <!-- data invoice -->
<div class="row">
    <div class="container">
        <div class="col-md-6 col-xs-6 col-lg-6 no-padding" style="right: 3px;height: 205px;">
            <div class="panel panel-default tablee-responsive sspacer-top-10 ccol-md-6" style="margin-left: 3px;margin-right: 3px;height: 150px;padding: 15px;">
                {leftElements}
            </div>
        </div>

        <div class="col-md-6 col-xs-6 col-lg-6 no-padding">
            <div class="panel panel-default tablee-responsive sspacer-top-10 ccol-md-6" style="margin-left: 3px;margin-right: 3px;height: 150px;">
                {rightElements}
            </div>
        </div>
    </div>
</div>


<div class="row">
    <div class="container">
        <div class="col-md-12 col-lg-12 no-padding" style="border: 0px solid red;">
            <div class="panel panel-default table-responsive spacer-top-10">
                {content}
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="container">
        <div class="col-md-12 col-lg-12 no-padding" style="border: 0px solid black;">
            <div class="col-md-6 col-xs-6 no-padding" style="right: 3px;">
                <div class="panel panel-default table-responsivex sspacer-top-10 ccol-md-6" style="height: 268px;">
                    {noteDetails}
                </div>
            </div>
            <div class="col-md-6 col-xs-6 no-padding" style="border: 1px ;">
                <div>
                    <div class="no-padding">
                        {sign_1}
                    </div>
                    <div class="no-padding">
                        {sign_2}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="col-md-12 no-padding" style="border: 0px solid black;">
    <div class="text-center text-muted"><i>Printed: <span class="realtime_date">1945-08-17 17:08:45</span></i></div>
</div>
</div>



<script>
    $(".realtime_date").html( Date() )
</script>

</body>
</html>
