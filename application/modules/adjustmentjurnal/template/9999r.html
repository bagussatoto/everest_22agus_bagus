<table>

                    </div>

                            </div>
                        </div>
                    </div>

                                </div>
                            </div>

                            <div class="col-md-6 col-xs-6 col-lg-6 no-padding" style="right: 3px;">

                                    {rightElements}
                                </div>
                            </div>
                        </div>
                    </div>

                </div> <!--  HEADER AREA  -->

                                </div>
