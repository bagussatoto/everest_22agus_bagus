<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <mete tpl="582spo_mod"></mete>
    <title>{title}</title>

    <style>
        html {
            zoom: 100%;
        }

        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        .pageHeader {
            position: fixed;
            /*width: 210mm;*/
            top: 0mm;
        }

        .pageBody {
            /*width: 210mm;*/
        }

        .pageFooter {
            position: fixed;
            /*width: 210mm;*/
            bottom: 0mm;
        }

        @page {
            size: A4 potrait;
            margin: 3mm;
        }

        @media print {
            html, body {
                /*zoom: initial;*/
                /*width: 210mm;*/
                /*height: 297mm;*/
            }
        }

        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }

            td {
                width: max-content;
            }
        }

        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }

            .text-white {
                display: none;
                visibility: hidden;
            }

            .col-sm-1, .col-xs-1 {
                margin-right: -25px;
            }
        }

        .img-thumbnail {
            border: none !important;
        }
    </style>
    <style type="text/css">
        .panel-element > .panel-heading {
            padding: 3px 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .panel-element > .panel-body {
            padding: 0 15px;
        }

        /*.table-condensed>tbody>tr>td{*/
        .panel-element > .panel-body > .table-condensed > tbody > tr > td {
            padding: 0 !important;
            border-top: none;
            text-transform: capitalize;
        }

        .tbl-label {
            width: 100px;
            /*text-transform: capitalize;*/
        }

        .panel-content > .table > tbody > tr > td {
            padding: 3px !important;
            /*border-top: none;*/
            text-transform: capitalize;
        }

        .nilai_nota, .harga, .subtotal {
            text-align: right;
        }

        .total {
            font-weight: bold;
            font-size: 16px !important;
        }

        .jumlah {
            border-top: 3px double #ddd !important;
            height: 30px;
            vertical-align: bottom !important;
            font-weight: bold;
        }

        .total_point {
            font-weight: bold;
        }
    </style>

    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>

    <script src="{cdn_suport}multi-step-modal-master/multi-step-modal.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-fileinput-master/js/fileinput.min.js?v={local_version}"></script>
