<!DOCTYPE html>

    <title>{title}</title>

    <style>
        html {
            zoom: 100%;
        }

        * {
            box-sizing: border-box;
            -moz-box-sizing: border-box;
        }

        .pageHeader {
            position: fixed;
            /*width: 210mm;*/
            top: 0mm;
        }

        .pageBody {
            /*width: 210mm;*/
        }

        .pageFooter {
            position: fixed;
            /*width: 210mm;*/
            bottom: 0mm;
        }

        @page {
            size: A4 potrait;
            margin: 3mm;
        }

        @media print {
            html, body {
                /*zoom: initial;*/
                /*width: 210mm;*/
                /*height: 297mm;*/
            }
        }

        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }

            td {
                width: max-content;
            }
        }

        @media print {
            a[href]:after {
                display: none;
                visibility: hidden;
            }

            .text-white {
                display: none;
                visibility: hidden;
            }

            .col-sm-1, .col-xs-1{
                margin-right: -25px;
            }

            .hidden-on-print {
                display: none !important;
            }
        }
        .img-thumbnail{
            border: none !important;
        }
    </style>
    <style type="text/css">
        .panel-default{
            border-color: #161212 !important;
        }
        .table-bordered>tbody>tr>th, .table-bordered>tbody>tr>td{
            border-color: #161212 !important;
        }
        .panel-element>.panel-heading{
            padding: 3px 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .panel{
            margin-bottom: 5px !important;
        }
        .panel-element>.panel-body{
            padding: 0 15px;
        }
        /*.table-condensed>tbody>tr>td{*/
        .panel-element>.panel-body>.table-condensed>tbody>tr>td{
            padding: 0 !important;
            border-top: none;
            text-transform: capitalize;
        }
        .tbl-label{
            width: 100px;
            /*text-transform: capitalize;*/
        }
        .panel-heading{
            padding: 2px 5px !important;
        }
        .panel-body {
             padding: 5px !important;
        }
        .panel-content>.table>tbody>tr>td{
            padding: 0 !important;
            border-top: none;
            text-transform: capitalize;
        }
        .alert{
            padding: 5px !important;
            margin-bottom: 5px !important;
        }
        .alert-danger{
            color: #000 !important;
            border-color: #000 !important;
        }
        .nilai_nota, .harga, .subtotal {
            text-align: right;
        }

        .total {
            font-weight: bold;
            font-size: 16px !important;
        }

        .jumlah {
            border-top: 3px double #ddd !important;
            /*height: 30px;*/
            vertical-align: top !important;
            font-weight: bold;
            text-align: right;
        }
        .grand_total{
            font-weight: bolder;
            font-size: 18px !important;
        }

        .total_point {
            font-weight: bold;
        }
    </style>
