<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>$_SESSION</title>

    <script type="text/javascript" src="{cdn_suport}json-viewer-master/src/json-viewer.js"></script>
    <link rel="stylesheet" type="text/css" href="{cdn_suport}json-viewer-master/src/json-viewer.css">
</head>
<body>
    <textarea style="width: 100%; min-height: 100px;display:none;"></textarea>
    <p>Pilih mau apa lu..:</p>
    <div>
        <button type="button" class="load-json">Buka JSON</button>
        <button type="button" class="collapse">Reload</button>
        <button type="button" class="maxlvl">Lihat SESSION pada Lv 1</button>
    </div>
    <h2>isi session saat ini:</h2>
    <div id="json"></div>
    <script>
        var jsonObj = {};
        var jsonViewer = new JSONViewer();
            document.querySelector("#json").appendChild(jsonViewer.getContainer());

        var textarea = document.querySelector("textarea");
            textarea.value = JSON.stringify({session});

        // textarea value to JSON object
        var setJSON = function() {
            try {
                var value = textarea.value;
                jsonObj = JSON.parse(value);
            }
            catch (err) {
                alert(err);
            }
        };

        // load default value
        setJSON();

        var loadJsonBtn = document.querySelector("button.load-json");
        var collapseBtn = document.querySelector("button.collapse");
        var maxlvlBtn   = document.querySelector("button.maxlvl");

        loadJsonBtn.addEventListener("click", function() {
            setJSON();
            jsonViewer.showJSON(jsonObj);
        });

        collapseBtn.addEventListener("click", function() {
            window.location.reload();
        });

        maxlvlBtn.addEventListener("click", function() {
            jsonViewer.showJSON(jsonObj, 1);
        });

        jsonViewer.showJSON(jsonObj, null, 1);

    </script>
</body>
</html>
