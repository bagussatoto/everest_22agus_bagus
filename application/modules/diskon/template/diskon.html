    <style>
        #switch{
            top: 50%;
            left: 0;
            width: 142px;
            height: 36px;
        }
        .toggle{
            position: relative;
            border: 2px solid #444249;
            border-radius: 20px;
            -webkit-transition: border-color .6s  ease-out;
            transition: border-color .6s  ease-out;
            box-sizing: border-box;
        }
        .toggle.toggle-on{
            border-color: rgba(137, 194, 217, .4);
            -webkit-transition: all .5s .15s ease-out;
            transition: all .5s .15s ease-out;
        }
        .toggle-button{
            position: absolute;
            top: 4px;
            width: 24px;
            bottom: 4px;
            right: 110px;
            background-color: #444249;
            border-radius: 19px;
            cursor: pointer;
            -webkit-transition: all .3s .1s, width .1s, top .1s, bottom .1s;
            transition: all .3s .1s, width .1s, top .1s, bottom .1s;
        }
        .toggle-on .toggle-button{
            top: 3px;
            width: 135px;
            bottom: 3px;
            right: 3px;
            border-radius: 23px;
            background-color: #3afa3c;
            box-shadow: 0 0 16px #249f23;
            -webkit-transition: all .2s .1s, right .1s;
            transition: all .2s .1s, right .1s;
        }
        .toggle-text-on{
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            line-height: 33px;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-size: 18px;
            font-weight: normal;
            cursor: pointer;
            -webkit-user-select: none; /* Chrome/Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+ */
            color: rgba(0,0,0,0);
        }
        .toggle-on .toggle-text-on{
            color: #ff003f;
            -webkit-transition: color .3s .15s;
            transition: color .3s .15s;
        }
        .toggle-text-off{
            position: absolute;
            top: 0;
            bottom: 0;
            right: 6px;
            line-height: 33px;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            font-weight: bold;
            -webkit-user-select: none; /* Chrome/Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+ */
            cursor: pointer;
            color: #444249;
        }
        .toggle-on .toggle-text-off{
            color: rgba(0,0,0,0);
        }
        /* used for streak effect */
        .glow-comp{
            position: absolute;
            opacity: 0;
            top: 10px;
            bottom: 10px;
            left: 10px;
            right: 10px;
            border-radius: 6px;
            background-color: rgba(75, 122, 141, .1);
            box-shadow: 0 0 12px rgba(75, 122, 141, .2);
            -webkit-transition: opacity 4.5s 1s;
            transition: opacity 4.5s 1s;
        }
        .toggle-on .glow-comp{
            opacity: 1;
            -webkit-transition: opacity 1s;
            transition: opacity 1s;
        }
    </style>

        .loading_2{
            /*align-items: center;*/

            text-decoration: blink;
            -webkit-animation-name: kelip;
            -webkit-animation-duration: 0.6s;
            -webkit-animation-iteration-count: infinite;
            -webkit-animation-timing-function: ease-in-out;
            -webkit-animation-direction: alternate;
        }

        @-webkit-keyframes kelip {
            /*0%, 49% {*/

            /*}*/
            /*50%, 100% {*/

            from {
                opacity: 1.0;
            }
            to {
                opacity: 0.0;
            }
        }

        .loader {
            width: 60px;

        }

        .loader-wheel {
            animation: spin 1s infinite linear;
            border: 2px solid rgba(30, 30, 30, 0.5);
            border-left: 4px solid #fff;
            border-radius: 50%;
            height: 50px;
            margin-bottom: 10px;
            width: 50px;
        }

        .loader-text {
            color: #fff;
            font-family: arial, sans-serif;
        }

        .loader-text:after {
            content: 'Loading boss';
            animation: load 2s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes load {
            0% {
                content: 'Loading';
            }
            33% {
                content: 'Loading.';
            }
            67% {
                content: 'Loading..';
            }

    <style type="text/css">

        .wrapper-radio{
            border: 0px solid red;
            /*width: 90px;*/
            margin-top: 8px;
        }
        .btn-radio {
            border: 1px solid #1a1a1a;
            display: inline-block;
            padding: 2px 10px;
            position: relative;
            text-align: center;
            transition: background 600ms ease, color 600ms ease;
        }

        .rad-l{
            border-radius: 5px 0 0 5px;
        }
        .rad-r{
            border-radius: 0 5px 5px 0;
        }

        input[type="radio"].toggle-radio {
            display: none;

        & + label {
              cursor: pointer;
              min-width: 30px;
              color: #bbbbbb;

        &:hover {
             background: none;
             color: #1a1a1a;
         }

        &:after {
             background: #1a1a1a;
             content: "";
             height: 100%;
             position: absolute;
             top: 0;
             transition: left 200ms cubic-bezier(0.77, 0, 0.175, 1);
             width: 100%;
             z-index: -1;
         }
        }

        &.toggle-left + label {
             border-right: 0;

        &:after {
             left: 100%
         }
        }
        &.toggle-center + label {
             margin-left: -2px;

        &:after {
             left: -100%;
         }
        }
        &.toggle-right + label {
             margin-left: -3px;

        &:after {
             left: -100%;
         }
        }

        &:checked + label {
             background-color: #9eff2d;
             cursor: default;
             color: #e30000;
             transition: color 200ms;

        &:after {
             left: 0;
         }
        }

        }

    </style>

<script type="text/javascript">
    var changingHash = false;

    function onbarcode(event) {
        switch (event.type) {
            case "hashchange": {
                if (changingHash == true) {
                    return;
                }
                var hash = window.location.hash;
                if (hash.substr(0, 3) == "#zx") {
                    hash = window.location.hash.substr(3);
                    changingHash = true;
                    window.location.hash = event.oldURL.split("\#")[1] || ""
                    changingHash = false;
                    processBarcode(hash);
                }
                break;
            }
            case "storage": {
                window.focus();
                if (event.key == "barcode") {
                    window.removeEventListener("storage", onbarcode, false);
                    processBarcode(event.newValue);
                }
                break;
            }
            default: {
                console.log(event)
                break;
            }
        }
    }

    window.addEventListener("hashchange", onbarcode, false);

    function getScan() {
        var href = window.location.href;
        var ptr = href.lastIndexOf("#");
        if (ptr > 0) {
            href = href.substr(0, ptr);
        }
        window.addEventListener("storage", onbarcode, false);
        setTimeout('window.removeEventListener("storage", onbarcode, false)', 15000);
        localStorage.removeItem("barcode");
        //window.open  (href + "#zx" + new Date().toString());
        if (navigator.userAgent.match(/Firefox/i)) {
            //Used for Firefox. If Chrome uses this, it raises the "hashchanged" event only.
            window.location.href = ("zxing://scan/?ret=" + encodeURIComponent(href + "#zx{CODE}"));
        } else {
            //Used for Chrome. If Firefox uses this, it leaves the scan window open.
            window.open("zxing://scan/?ret=" + encodeURIComponent(href + "#zx{CODE}"));
        }
    }

    function processBarcode(bc) {
//        e = jQuery.Event("keyup")
//        e.which = 13 //choose the one you want
//        $("#itemKeyword").keyup(function(event){
//            console.log('stringnya:');

        $('#itemKeyword').val(bc);
//        $('#itemKeyword').trigger(e);
//
//        $(function() {
//            var e = $.Event('onkeyup');
//            e.which = 13; // Character 'A'
//            $('#itemKeyword').trigger(e);
//        });

//        var event = document.createEvent('KeyboardEvent'); // create a key event
//// define the event
//        event.initKeyEvent("keyup",       // typeArg,
//                true,             // canBubbleArg,
//                true,             // cancelableArg,
//                null,             // viewArg,  Specifies UIEvent.view. This value may be null.
//                false,            // ctrlKeyArg,
//                false,            // altKeyArg,
//                false,            // shiftKeyArg,
//                false,            // metaKeyArg,
//                13,               // keyCodeArg,
//                13);              // charCodeArg);
//
//        document.getElementById('itemKeyword').dispatchEvent(event);

        var keyboardEvent = new KeyboardEvent('keyup', {bubbles: true});
        Object.defineProperty(keyboardEvent, 'charCode', {
            get: function () {
                return this.charCodeVal;
            }
        });
        keyboardEvent.charCodeVal = [13];
        document.getElementById('itemKeyword').dispatchEvent(keyboardEvent);
    }

    function scrollParentToChild(parent, child) {
        var parentRect = parent.getBoundingClientRect();
        var parentViewableArea = {
            height: parent.clientHeight,
            width: parent.clientWidth
        };
        var childRect = child.getBoundingClientRect();
        var isViewable = (childRect.top >= parentRect.top) && (childRect.top <= parentRect.top + parentViewableArea.height);
        if (!isViewable) {
            parent.scrollTop = (childRect.top + parent.scrollTop) - parentRect.top
        }
    }
