<!DOCTYPE html>
<html lang="en"> <!-- print_a4.html -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--<meta http-equiv="X-UA-Compatible" content="IE=edge">-->
    <title>{title}</title>
    <link rel="stylesheet" href="{base}assets/custom/custom.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}bootstrap-3.3.7-dist/css/bootstrap.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}Font-Awesome-master/css/font-awesome.min.css?v={local_version}">
    <link rel="stylesheet" href="{cdn_suport}AdminLTE-2.3.11/dist/css/AdminLTE.css?v={local_version}">

    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/jQuery/jquery-2.2.3.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-3.3.7-dist/js/bootstrap.min.js?v={local_version}"></script>
    <script src="{cdn_suport}sweetalert2-master/dist/sweetalert2.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap3-dialog-master/dist/js/bootstrap-dialog.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/plugins/slimScroll/jquery.slimscroll.min.js?v={local_version}"></script>
    <script src="{cdn_suport}AdminLTE-2.3.11/dist/js/app.min.js?v={local_version}"></script>
    <script src="{cdn_suport}multi-step-modal-master/multi-step-modal.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-fileinput-master/js/fileinput.min.js?v={local_version}"></script>
    <script src="{cdn_suport}bootstrap-toggle-master/js/bootstrap-toggle.min.js?v={local_version}"></script>
    <script src="{base}assets/custom/hippo_ajax.js?v={local_version}"></script>

    <style type="text/css">
        /* Gaya Umum */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .content {
            margin: 0px 0px 20px; /* Beri ruang untuk header dan footer */
            border: 1px solid #eeeeee;
            /*height: 563px;*/
            /*overflow: hidden;*/
        }

        /* Gaya untuk Header */
        .header {
            /*border-top: chocolate 1px solid;*/
            /*border-bottom: #b9bbbe 1px solid;*/
            background-color: #f1f1f1;
            padding: 10px;
            text-align: center;
            /*position: fixed;*/
            top: 0;
            width: 100%;
            height: 442px;
        }

        /* Gaya untuk Footer */
        .footer {
            /*border-top: #bbbbbb 1px solid;*/
            background-color: #f1f1f1;
            padding: 10px;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 250px;
        }

        @media screen {
            a[href]:after {
                display: none;
                visibility: hidden;
            }

            td {
                width: max-content;
            }
        }
        @page {
            size: A4 potrait;
            margin: 3mm;
        }
        /* Gaya Khusus untuk Cetak */
        @media print {
            body {
                margin: 0;
            }

            .header, .footer {
                position: fixed;
                background-color: #eeeeee !important;
            }

            .header {
                top: 0;
                height: 414px;
            }

            .footer {
                bottom: 0;

            }

            .content {
                margin-top: 398px;
                /*margin-bottom: 120px;*/
                page-break-before: auto;
                page-break-after: auto;
            }

            a[href]:after {
                display: none;
                visibility: hidden;
            }

            .text-white {
                display: none;
                visibility: hidden;
            }

            .col-sm-1, .col-xs-1 {
                margin-right: -25px;
            }

            .hidden-on-print {
                display: none !important;
            }
        }
    </style>
    <style type="text/css">
        .panel-element > .panel-heading {
            padding: 3px 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .panel-element > .panel-body {
            padding: 0 15px;
        }

        /*.table-condensed>tbody>tr>td{*/
        .panel-element > .panel-body > .table-condensed > tbody > tr > td {
            padding: 0 !important;
            border-top: none;
            text-transform: capitalize;
        }

        .tbl-label {
            width: 100px;
            /*text-transform: capitalize;*/
        }

        .panel-content > .table > tbody > tr > td {
            padding: 0 !important;
            border-top: none;
            text-transform: capitalize;
        }

        .nilai_nota, .harga, .subtotal {
            text-align: right;
        }

        .total {
            font-weight: bold;
            font-size: 16px !important;
        }

        .jumlah {
            border-top: 3px double #ddd !important;
            height: 30px;
            vertical-align: top !important;
            font-weight: bold;
            text-align: right;
        }

        .grand_total {
            font-weight: bolder;
            font-size: 18px !important;
        }

        .total_point {
            font-weight: bold;
        }
    </style>

</head>
<body class="hold-transition skin-blue sidebar-mini" onload="" style="padding: 0 10px;">

<div class="header">
    {option}
    <div class="spacer">&nbsp;</div>

    <div class="row" style="padding-left: 30px;padding-right: 30px;">
        <div class="row" style="margin-bottom: 10px;">
            <div id="cprofile" class="text-left col-md-6 col-xs-6 col-sm-6">

                <div class="text-left overflow-h">
                    <div id="logo" class="text-left no-padding {lg_hidden}"
                         style="margin-top:2px;margin-right: 0px; height: 100px;width: 102px;float: left;">
                        {logo_header_print_00}
                    </div>
                    {companyProfile}
                </div>
            </div>
            <div class="text-right">{tanggal_transaksi}</div>
        </div>
    </div>

    <div class="row" style="padding-left: 15px;padding-right: 15px;">
        <div class="text-left col-md-6 col-xs-6 col-sm-6">
            {pihakProfile}
        </div>
        <div class="text-left col-md-6 col-xs-6 col-sm-6">
            {deliveryDetails}
        </div>
    </div>
    <div class="row" style="padding-left: 15px;padding-right: 15px;">
        <div class="text-left col-md-3 col-xs-3 col-sm-3">
            {ordergDate}
        </div>
        <div class="text-left col-md-3 col-xs-3 col-sm-3" style="padding-left: 0px;">
            {nomerSo}
        </div>
        <div class="text-left col-md-3 col-xs-3 col-sm-3" style="padding-left: 0px;">
            {salesman}
        </div>
        <div class="text-left col-md-3 col-xs-3 col-sm-3" style="padding-left: 0px;">
            {status}
        </div>
    </div>
</div>

<div class="content">
    <div class="row" style="padding-left: 23px;padding-right: 23px;">
        <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 no-padding text-capitalize">
            <div class="panel panel-default no-padding">
                {content}
            </div>
        </div>
    </div>
</div>

<div class="footer">
    <div class="row" style="padding-left: 30px;padding-right: 30px;">
        <div class="col-xs-5 col-sm-5 col-md-5 col-lg-5 no-padding">
            {statik_note}
        </div>
    </div>

    <div class="row" style="padding-left: 30px;padding-right: 30px;">
        <div class="col-xs-9 col-sm-9 col-md-9 col-lg-9 no-padding text-center border-cekk">
            <div class="col-xs-2 col-sm-2 col-md-2 col-lg-2 no-padding text-center">
                {sign_4}
            </div>
            <div class="col-xs-2 col-sm-2 col-md-2 col-lg-2 no-padding text-center">
                {sign_2}
            </div>
            <div class="col-xs-2 col-sm-2 col-md-2 col-lg-2 no-padding text-center">
                {driver}
            </div>
            <div class="col-xs-3 col-sm-3 col-md-2 col-lg-2 no-padding text-center">
                {worker}
            </div>
        </div>

        <div class="col-xs-3 col-sm-3 col-md-3 col-lg-3 no-padding text-center">
            {customer}
        </div>
    </div>
</div>

</body>
</html>
